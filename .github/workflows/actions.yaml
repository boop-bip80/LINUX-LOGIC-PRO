name: Darling CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request: {}

# Preserve every legacy packaging job. Only cancel stale runs of the same PR
# when a newer PR revision arrives. Push runs, especially main, are never
# preempted or replace another pending push; PR and push groups cannot collide.
concurrency:
  group: "darling-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Darling
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install devscripts equivs debhelper
        sudo mk-build-deps -i -r -t "apt-get --no-install-recommends -y" debian/control

    # see https://github.com/actions/virtual-environments/issues/2606#issuecomment-772683150
    - name: Free up space
      run: |
        sudo rm -rf /usr/share/dotnet

    - name: Build DEBs
      run: |
        ./tools/debian/make-deb

    - name: Move DEBs
      run: |
        mkdir dist && mv ../*.deb dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: 'debs'
        path: dist/

  build-dsc:
    runs-on: ubuntu-latest
    env:
      DARLING_PACKAGE_TEST_REQUIRE_CONTAINER: '1'
    steps:
    - name: Checkout Darling
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install devscripts equivs debhelper

    - name: Prepare isolated real source-package fixture builder
      run: |
        set -euo pipefail
        bash ci/logic-pro/prepare-package-fixture.sh "$RUNNER_TEMP/debian-fixture-environment"
        echo "DARLING_PACKAGE_TEST_IMAGE=$(cat "$RUNNER_TEMP/debian-fixture-environment/image-id.txt")" >> "$GITHUB_ENV"

    - name: Test Debian source packaging
      run: python3 -u -B -m unittest discover -s tests/compat/logic-pro/build -p 'test_debian_packaging.py' -v

    - name: Preserve source-package fixture environment
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: 'debian-fixture-environment'
        path: ${{ runner.temp }}/debian-fixture-environment/
        if-no-files-found: error
        retention-days: 90

    - name: Build DSCs
      run: |
        ./tools/debian/make-deb --dsc

    - name: Move DSCs
      run: |
        ./tools/debian/collect-source-artifacts source

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: 'deb-source'
        path: source/
        if-no-files-found: error

  create-source-artifact:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Darling
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: source/darling

    - name: Compress source
      run: |
        mkdir -v archive
        tar --create --use-compress-program="xz -9e" --verbose \
            --file archive/darling-source.tar.xz \
            --exclude=.git --exclude=.gitmodules --exclude=.gitignore \
            --directory=source \
            darling

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: 'source'
        path: archive/
