name: P002 reproducible recursive submodules

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - '.github/workflows/phase2-submodules.yml'
      - 'tools/compat/logic-pro/check_submodules.py'
      - 'tools/compat/logic-pro/make_submodule_lock.py'
      - 'tools/compat/logic-pro/run_submodule_campaign.py'
      - 'tools/compat/logic-pro/lfs_manifest.py'
      - 'tools/compat/logic-pro/inventory.py'
      - 'tests/compat/logic-pro/submodules/**'
      - 'docs/compat/logic-pro/submodules.lock.json'
      - 'docs/compat/logic-pro/lfs-provenance.json'
      - 'src/external/**'
  pull_request:
    paths:
      - '.gitmodules'
      - '.github/workflows/phase2-submodules.yml'
      - 'tools/compat/logic-pro/check_submodules.py'
      - 'tools/compat/logic-pro/make_submodule_lock.py'
      - 'tools/compat/logic-pro/run_submodule_campaign.py'
      - 'tools/compat/logic-pro/lfs_manifest.py'
      - 'tools/compat/logic-pro/inventory.py'
      - 'tests/compat/logic-pro/submodules/**'
      - 'docs/compat/logic-pro/submodules.lock.json'
      - 'docs/compat/logic-pro/lfs-provenance.json'
      - 'src/external/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p002-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-clone:
    name: Independent clone ${{ matrix.id }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: a, os: ubuntu-22.04}
          - {id: b, os: ubuntu-24.04}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_ROOT_SHA: ${{ github.sha }}
      P002_HOST_ID: ${{ matrix.id }}
    steps:
      - name: Checkout the verifier without using an existing submodule cache
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Qualify the exact SHA with an independent anonymous Git and LFS checkout
        shell: bash
        run: |
          set -euo pipefail
          # Each matrix job has its own VM and newly allocated object store.
          # The runner fetches/checks out exactly EXPECTED_ROOT_SHA, including
          # PR merge commits and pushes whose master branch has since advanced.
          # It retains command exits and partial evidence on a failed gate.
          python3 -B tools/compat/logic-pro/run_submodule_campaign.py \
            --source "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/p002-independent-clone-$P002_HOST_ID" \
            --output "$RUNNER_TEMP/p002-evidence" \
            --commit "$EXPECTED_ROOT_SHA" \
            --host-id "$P002_HOST_ID"

      - name: Upload reproducible raw clone and lock-verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p002-clone-${{ matrix.id }}-${{ github.sha }}
          path: ${{ runner.temp }}/p002-evidence/
          if-no-files-found: error
          retention-days: 90
